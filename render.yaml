services:
  - type: web
    name: prd-maker
    env: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 18.0.0
    scaling:
      minInstances: 1
      maxInstances: 1
    healthCheckPath: /
    buildFilter:
      paths:
        - package.json
        - server.js
        - index.html
